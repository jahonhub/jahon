<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raxmo_n1 Tulqi_n1</title>
<h1>
         📸    📸 Foto sayt 📸  😎 
</h1>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#141e30,#243b55);
  color:white;
}

/* Sarlavha */
h2{
  text-align:center;
  padding:20px;
}

/* GRID */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:20px;
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.gallery-item{
  position:relative;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,0.5);
}

.gallery-item img{
  width:100%;
  display:block;
  transition:0.4s;
}

.gallery-item:hover img{
  transform:scale(1.05);
}

/* LIKE */
.like-box{
  position:absolute;
  bottom:10px;
  right:10px;
  background:rgba(0,0,0,0.6);
  padding:5px 10px;
  border-radius:20px;
  display:flex;
  align-items:center;
  gap:5px;
  font-size:14px;
  cursor:pointer;
}

.heart{
  font-size:18px;
  transition:0.3s;
}

.liked{
  color:red;
  transform:scale(1.2);
}

/* LIGHTBOX */
.lightbox{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.95);
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  pointer-events:none;
  transition:0.4s;
  z-index:1000;
}

.lightbox.show{
  opacity:1;
  pointer-events:auto;
}

.lightbox img{
  max-width:90%;
  max-height:90%;
  border-radius:15px;
}

.nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:40px;
  cursor:pointer;
  padding:10px;
  user-select:none;
}

.prev{ left:20px; }
.next{ right:20px; }

/* FOOTER */
.footer{
  margin-top:40px;
  padding:20px;
  text-align:center;
  background:rgba(0,0,0,0.4);
  font-size:14px;
}
</style>
</head>
<body>

<h2>✨ 📸 Premium Galerey📸✨</h2>

<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox">
  <span class="nav prev" id="prev">&#10094;</span>
  <img id="lightbox-img">
  <span class="nav next" id="next">&#10095;</span>
</div>

<footer class="footer">
  © <span id="year"></span>  Barcha huquqlar himoyalangan.
</footer>

<script>
const gallery = document.getElementById("gallery");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const prev = document.getElementById("prev");
const next = document.getElementById("next");

const total = 18;
let currentIndex = 0;
let images = [];

/* Rasmlar yaratish */
for(let i=1;i<=total;i++){

  const item = document.createElement("div");
  item.className="gallery-item";

  const img = document.createElement("img");
  img.src=i+".jpg";
  images.push(img.src);

  img.onclick=()=>{
    currentIndex=i-1;
    openLightbox();
  };

  /* LIKE */
  const likeBox=document.createElement("div");
  likeBox.className="like-box";

  const heart=document.createElement("span");
  heart.className="heart";
  heart.innerHTML="❤";

  const count=document.createElement("span");

  let likes=localStorage.getItem("likes_"+i)||0;
  let liked=localStorage.getItem("liked_"+i)==="true";

  count.innerHTML=likes;
  if(liked) heart.classList.add("liked");

  likeBox.onclick=(e)=>{
    e.stopPropagation();

    if(!liked){
      likes++;
      liked=true;
      heart.classList.add("liked");
    }else{
      likes--;
      liked=false;
      heart.classList.remove("liked");
    }

    count.innerHTML=likes;
    localStorage.setItem("likes_"+i,likes);
    localStorage.setItem("liked_"+i,liked);
  };

  likeBox.appendChild(heart);
  likeBox.appendChild(count);
  item.appendChild(img);
  item.appendChild(likeBox);
  gallery.appendChild(item);
}

/* LIGHTBOX */
function openLightbox(){
  lightboxImg.src=images[currentIndex];
  lightbox.classList.add("show");
}

function closeLightbox(){
  lightbox.classList.remove("show");
}

function nextImage(){
  currentIndex=(currentIndex+1)%total;
  lightboxImg.src=images[currentIndex];
}

function prevImage(){
  currentIndex=(currentIndex-1+total)%total;
  lightboxImg.src=images[currentIndex];
}

next.onclick=(e)=>{e.stopPropagation();nextImage();}
prev.onclick=(e)=>{e.stopPropagation();prevImage();}
lightbox.onclick=closeLightbox;

document.addEventListener("keydown",(e)=>{
  if(e.key==="Escape") closeLightbox();
  if(e.key==="ArrowRight") nextImage();
  if(e.key==="ArrowLeft") prevImage();
});

/* Swipe */
let startX=0;

lightboxImg.addEventListener("touchstart",(e)=>{
  startX=e.touches[0].clientX;
});

lightboxImg.addEventListener("touchend",(e)=>{
  let endX=e.changedTouches[0].clientX;

  if(startX-endX>50) nextImage();
  if(endX-startX>50) prevImage();
});

/* Avtomatik yil */
document.getElementById("year").innerHTML=new Date().getFullYear();
</script>

</body>
</html>
